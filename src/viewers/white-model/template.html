<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空间白模</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#26323b;background:#f4f6f7}header{padding:18px 24px 12px;background:#fff;border-bottom:1px solid #dce2e5}h1{font-size:22px;margin:0;font-weight:650}header p{margin:3px 0;color:#627480;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;height:calc(100vh - 104px)}.stage{min-width:0;display:flex;flex-direction:column}.toolbar{padding:12px 18px;display:flex;gap:7px;flex-wrap:wrap;background:#f4f6f7}button,select{font:inherit;padding:5px 10px;border-radius:6px;background:white;border:1px solid #cad4db;color:#26323b;cursor:pointer}button:hover{border-color:#345567}button.active{background:#345567;color:white;border-color:#345567}#canvas{position:relative;min-height:420px;flex:1;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.hint{padding:7px 18px;color:#627480;font-size:12px}.aside{padding:16px;background:white;overflow:auto;border-left:1px solid #dce2e5}h2{font-size:14px;margin:0 0 8px}section{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid #e4e8eb}label{display:block;margin:10px 0}input[type=range]{width:100%;accent-color:#345567}input[type=checkbox]{accent-color:#345567}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}#levels div{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}b{font-variant-numeric:tabular-nums;font-weight:600}.note{font-size:12px;color:#63747e}.pill{display:inline-block;background:#edf2f4;padding:2px 7px;border-radius:4px;font-size:12px;margin:3px 0}summary{cursor:pointer;font-weight:600}details p{font-size:12px;color:#63747e}a{color:#345567}.export{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:750px){header{padding:12px}h1{font-size:19px}.layout{display:block;height:auto}.stage{height:74vh;min-height:540px}.aside{border-left:0;border-top:1px solid #dce2e5;overflow:visible;padding:14px}.toolbar{padding:10px;gap:6px}button,select{font-size:12px}#canvas{min-height:350px}.hint{padding:6px 10px}}
[hidden]{display:none!important}.walk-pad{position:absolute;bottom:18px;left:18px;z-index:3;display:grid;grid-template-columns:44px 44px 44px;gap:5px;touch-action:none}.walk-pad button{height:44px;background:#ffffffdf;font-size:20px;user-select:none}.walk-pad .up{grid-column:2}.walk-pad .left{grid-column:1}.walking #canvas{cursor:grab}.walking #canvas:active{cursor:grabbing}#walkLocation{font-size:12px;color:#345567;font-weight:600}.walk-settings select{max-width:100%;width:100%;margin:4px 0}.walk-settings button{margin-top:7px}button:disabled,select:disabled{opacity:.45;cursor:default}
#walkHud,#walkExitOverlay{position:absolute;top:12px;z-index:4;background:#ffffffdf;border-radius:6px}#walkHud{left:12px;padding:5px 8px;font-size:12px}#walkExitOverlay{right:12px}
</style></head><body><header><h1 id="projectTitle">空间白模</h1><p>平面数据 · 空间核查 · 室内漫游</p></header><div class="layout"><div class="stage"><div id="floors" class="toolbar"></div><div id="canvas"><span id="walkHud" hidden></span><button id="walkExitOverlay" hidden>退出漫游</button><div id="walk-pad" class="walk-pad" hidden aria-label="漫游移动"><button class="up" data-walk-key="KeyW" aria-label="前进">↑</button><button class="left" data-walk-key="KeyA" aria-label="左移">←</button><button data-walk-key="KeyS" aria-label="后退">↓</button><button data-walk-key="KeyD" aria-label="右移">→</button></div></div><div class="hint">拖动旋转 · 滚轮缩放 · 右键平移 · 双指缩放　<span id="status">正在建立模型…</span></div></div><aside class="aside"><section class="walk-settings"><h2>走进房间</h2><div class="row"><select id="walkFloor" aria-label="漫游楼层"></select><select id="walkRoom" aria-label="进入房间"></select></div><button id="walkEnter">进入房间漫游</button> <button id="walkExit" hidden>返回鸟瞰</button><p id="walkLocation"></p><label for="eye" class="row">视点高度 <b id="eyeValue">1.65 m</b></label><input id="eye" type="range" min="1200" max="1900" step="50" value="1650"><p class="note">WASD／方向键移动，拖动画面转头；手机可按画面方向键移动。Esc返回鸟瞰。墙体、家具和挑空边缘有阻挡，可走示意楼梯。</p></section><section><h2>查看空间</h2><div class="row"><select id="mode" aria-label="楼层显示"><option value="exploded">楼层展开</option><option value="stacked">实际标高叠放</option></select><button id="fit">居中</button><button id="top">俯视</button></div><label><input id="low" type="checkbox" checked> 剖低墙及高柜（1.4m）</label><label><input id="roof" type="checkbox"> 显示顶板</label><label><input id="furniture" type="checkbox" checked> 显示家具</label><label><input id="furnReal" type="checkbox" checked> 家具用真模型（GLB）</label><label><input id="furnColor" type="checkbox"> 显示家具材质（否则白模）</label><label>家具配色 <select id="palette"><option value="warm">暖木色＋浅色软包</option><option value="original">保留模型原色</option></select></label><label><input id="openingModels" type="checkbox" checked> 显示门窗模型</label><label>门扇开启程度<input id="doorOpen" type="range" min="0" max="100" value="100"></label><label><input id="trace" type="checkbox"> 叠加原平面细节线稿</label><label><input id="section" type="checkbox"> 移除前侧遮挡（剖视）</label><button id="basementView">查看组合空间</button><label for="cut" class="row">水平剖切 <b id="cutValue">完整</b></label><input id="cut" type="range" min="5" max="100" value="100"></section><section id="dimensionSettings"><details><summary>柜体与门窗尺寸</summary><p class="note">平面位置依照原图；未标注的竖向尺寸是预览值。修改保存在当前浏览器，可导出备份。</p><label>选择构件<select id="dimensionObject" style="width:100%"></select></label><label id="cabinetRoleLabel">柜体类型<select id="cabinetRole" style="width:100%"><option value="full">到顶高柜</option><option value="counter">台柜</option><option value="low">矮柜</option><option value="bar">吧台</option><option value="appliance">设备高柜（固定高度）</option></select></label><label>顶部离地高度 mm<input id="dimensionHeight" type="number" min="300" max="100000" step="50" style="width:100%"></label><label id="sillLabel">窗台离地 mm<input id="dimensionSill" type="number" min="0" max="5000" step="50" style="width:100%"></label><p id="dimensionNote" class="note"></p><button id="dimensionReset">恢复此构件</button> <button id="dimensionExport">导出尺寸参数</button><label>导入尺寸参数<input id="dimensionImport" type="file" accept="application/json,.json" style="max-width:100%"></label></details></section><section><h2>楼面标高</h2><div id="levels"></div><p class="note">基准由项目标高数据指定。展开视图额外拉开楼层，数值仍显示实际预览标高。</p></section><section><h2>预览参数</h2><span class="pill">板厚待确认</span><label for="slab" class="row">楼板＋楼面构造 <b id="slabValue">150 mm</b></label><input id="slab" type="range" min="50" max="500" step="10" value="150"><div id="clearHeights" class="note"></div></section><section><details><summary>图纸与预览依据</summary><p id="projectNotes" style="white-space:pre-wrap"></p></details></section><div class="export"><button id="png">导出 PNG</button><button id="glb">导出 GLB</button><button id="reset">恢复初始</button></div><p class="note">GLB将各层恢复实际标高，并保留当前家具／低墙／顶板／线稿状态。需要完整墙高时先取消“剖低墙”。</p></aside></div><script type="application/json" id="furn-glb">__FURN__</script><script type="application/json" id="model-data">__DATA__</script><script>__JS__</script></body></html>
