name: verify

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 与 Windows 是两位开发的主环境；Linux 由 Windows runner 覆盖大部分差异
        os: [macos-latest, windows-latest]
        # 22 是索引可用的最低大版本，24 是当前开发版本
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # 快速门禁：232 项测试 + 能力契约 + 目录规范 + 技能包 + 发布边界（约 7 秒）
      - run: npm run verify

  browser:
    name: browser smoke (macOS)
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # GitHub 的 macOS 镜像自带 Google Chrome，puppeteer-core 直接复用
      - run: npm run verify:browser
